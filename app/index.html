<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>VICE COVER STUDIO</h1>
  <p class="tagline">Turn your photo and a caption into GTA-style cover art. Offline, on your machine.</p>
</header>
<main class="studio">
  <section class="controls" aria-label="Cover editor">
    <div class="group">
      <h2>1 · Photo</h2>
      <label class="file-label" for="photoFile">Upload a photo</label>
      <input id="photoFile" type="file" accept="image/*">
      <div class="row">
        <button id="sampleBoulevard" type="button" class="chip">Boulevard sample</button>
        <button id="samplePier" type="button" class="chip">Pier sample</button>
      </div>
      <p class="hint">Loaded: <span id="photoName">boulevard.jpg</span></p>
    </div>

    <div class="group">
      <h2>2 · Caption</h2>
      <input id="captionText" type="text" value="SUNSET HEIST" maxlength="48" aria-label="Caption">
    </div>

    <div class="group">
      <h2>3 · Panels</h2>
      <div class="row">
        <button type="button" class="chip" data-layout="hero">Hero</button>
        <button type="button" class="chip" data-layout="split">Split</button>
        <button type="button" class="chip" data-layout="stack">Stack</button>
      </div>
      <div id="panelPicker" class="row" aria-label="Pick a panel to crop"></div>
      <label for="panX">Pan left / right <span id="panXValue">0</span></label>
      <input id="panX" type="range" min="-100" max="100" value="0">
      <label for="panY">Pan up / down <span id="panYValue">0</span></label>
      <input id="panY" type="range" min="-100" max="100" value="0">
      <label for="zoom">Zoom <span id="zoomValue">100%</span></label>
      <input id="zoom" type="range" min="100" max="200" value="100">
    </div>

    <div class="group">
      <h2>4 · Colour grade</h2>
      <div class="row">
        <button type="button" class="chip" data-grade="sunset">Sunset</button>
        <button type="button" class="chip" data-grade="neon">Neon</button>
        <button type="button" class="chip" data-grade="noir">Noir</button>
      </div>
    </div>

    <div class="group">
      <h2>5 · Caption style</h2>
      <div class="row">
        <button type="button" class="chip" data-caption-style="white">White</button>
        <button type="button" class="chip" data-caption-style="gold">Gold</button>
        <button type="button" class="chip" data-caption-style="neon">Neon</button>
      </div>
    </div>

    <div class="group">
      <h2>6 · Export size</h2>
      <div id="sizeButtons" class="row"></div>
      <button id="exportPng" type="button" class="export">Export PNG</button>
      <p id="downloadNote" class="hint" role="status"></p>
    </div>
  </section>

  <section class="preview-pane" aria-label="Live preview">
    <h2>Live preview</h2>
    <canvas id="preview" width="560" height="315"></canvas>
    <p class="hint">The preview is the cover: what you see is what the PNG holds.</p>
  </section>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
