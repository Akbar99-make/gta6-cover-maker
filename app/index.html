<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p class="tagline">Turn a photo and a caption into GTA-style cover art. Your photos never leave this machine.</p>

    <div class="group">
      <h2>1 · Layout</h2>
      <div class="row tight">
        <button type="button" data-layout="multi" class="active">Multi-panel</button>
        <button type="button" data-layout="single">Single hero</button>
        <button type="button" data-layout="split">Split</button>
      </div>
    </div>

    <div class="group">
      <h2>2 · Photos</h2>
      <div class="row">
        <button type="button" data-panel="0" class="active">Panel 1</button>
        <button type="button" data-panel="1">Panel 2</button>
        <button type="button" data-panel="2">Panel 3</button>
      </div>
      <div class="row">
        <button type="button" id="sample-boulevard">Boulevard sample</button>
        <button type="button" id="sample-pier">Pier sample</button>
      </div>
      <div class="row">
        <button type="button" id="upload-btn">Upload your photo…</button>
        <input id="upload" type="file" accept="image/*" hidden>
      </div>
      <label class="slider-label">Zoom <span id="zoom-value">100%</span>
        <input id="zoom" type="range" min="100" max="300" value="100">
      </label>
      <div class="row">
        <button type="button" id="fill-all">Same photo in all panels</button>
        <button type="button" id="reset-panel">Reset framing</button>
      </div>
      <p class="hint">Drag the photo inside the preview to move it. Click a panel to select it.</p>
    </div>

    <div class="group">
      <h2>3 · Caption</h2>
      <label>Title <input id="title" type="text" maxlength="32" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="48" value="Vice City • One Last Score"></label>
    </div>

    <div class="group">
      <h2>4 · Preview size</h2>
      <div class="row tight">
        <button type="button" data-size="square" class="active">1080 × 1080</button>
        <button type="button" data-size="portrait">1080 × 1350</button>
        <button type="button" data-size="wide">1920 × 1080</button>
      </div>
    </div>

    <div class="group">
      <h2>5 · Export PNG</h2>
      <div class="row tight export-row">
        <button type="button" data-export="square">1080 × 1080</button>
        <button type="button" data-export="portrait">1080 × 1350</button>
        <button type="button" data-export="wide">1920 × 1080</button>
      </div>
    </div>

    <p id="status" role="status"></p>
  </section>
  <section class="stage" aria-label="Live preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
